<!doctype html>
<html>
  <head>
    <title>Chat Socket.IO UNA</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font: 13px Helvetica, Arial; }
      form { background: #000; padding: 3px; position: fixed; bottom: 0; width: 100%; }
      form input { border: 0; padding: 10px;}
      form button { width: 10%; background: rgb(130, 224, 255);  border: none; padding: 10px; }
      #messages { list-style-type: none; margin: 0; padding: 0; }
      #messages li { padding: 5px 10px; }
      #messages li:nth-child(odd) { background: #eee; }
      #messages { margin-bottom: 40px }
      #nombre, #m { display: inline-block;}
      #m {width: 69%; margin-right: 4px;}
      #nombre {width: 20%}
    </style>
  </head>
  <body>
    <header id="session" aria-live="polite">
      <span id="session-status">Verificando sesión...</span>
      <a id="session-action" hidden></a>
    </header>
    <ul id="messages"></ul>
    <form action="">
      <input id="nombre" autocomplete="off" placeholder="Username"/>
      <input id="m" autocomplete="off" placeholder="Escriba un mensaje" /><button>Send</button>
    </form>
    <script src="https://cdn.socket.io/4.7.2/socket.io.js"></script>
    <script src="https://code.jquery.com/jquery-1.11.1.js"></script>
    <script>

    var colorHexTxt = "";

    // genera colores aleatorios en hexadeximal
    function getRandomColor() {
        var letters = '0123456789ABCDEF';
        var color = '#';
        for (var i = 0; i < 6; i++) {
          color += letters[Math.floor(Math.random() * 16)];
        }

        return color;
     }

      $(function () {
        fetch('/api/me')
          .then(function(response) {
            if (!response.ok) {
              throw new Error('No se pudo verificar la sesión.');
            }
            return response.json();
          })
          .then(function(session) {
            var status = $('#session-status');
            var action = $('#session-action');
            if (session.authenticated && session.user) {
              status.text('Sesión iniciada: ' + (session.user.name || session.user.email));
              action.text('Cerrar sesión').attr('href', '/logout').prop('hidden', false);
            } else {
              status.text('No hay una sesión autenticada.');
              action.text('Iniciar sesión').attr('href', '/login').prop('hidden', false);
            }
          })
          .catch(function(error) {
            $('#session-status').text(error.message + ' Intenta recargar.');
          });

        var socket = io();

        // emite evento al servidor
        
        $('form').submit(function(){
            var nombreTxt = $('#nombre').val() || "Anomimo";
            var mensajeTxt = $('#m').val();

            if (colorHexTxt == "") {
                colorHexTxt = getRandomColor();
            }

            var jsonMsg = { nombre: nombreTxt, mensaje: mensajeTxt, color: colorHexTxt };
            socket.emit('Evento-Mensaje-Server', JSON.stringify(jsonMsg));
            $('#m').val('');
            return false;
        });

        // ... (resto del código) ...

        socket.on('Evento-Mensaje-Server', function(msg){
            var msgJson = JSON.parse(msg);
            var sender = $('<b>').css('color', msgJson.color).text(msgJson.nombre);
            var message = $('<li>').append(sender).append(document.createTextNode(': '));
            var content = $.trim(msgJson.mensaje);

            if ((msgJson.tipo === 'image' && content.indexOf('<img ') === 0) ||
                (msgJson.tipo === 'video' && content.indexOf('<iframe ') === 0)) {
                message.append($(content));
            } else {
                message.append(document.createTextNode(msgJson.mensaje));
            }

            $('#messages').append(message);
            window.scrollTo(0, document.body.scrollHeight);
        });

      });
    </script>
  </body>
</html>
